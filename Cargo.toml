[package]
name = "retro-hub"
version = "1.2.0"
edition = "2021"
authors = ["Claudio Dall'Ara"]
description = "Ultra-fast retrogaming launcher and catalog manager in Rust"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.32", features = ["bundled"] }
strsim = "0.11"
regex = "1.10"
walkdir = "2.5"
open = "5.3"
tiny_http = "0.12"
rand = "0.8"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
