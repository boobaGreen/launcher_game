[package]
name = "retro-hub"
version = "0.1.0"
edition = "2021"
authors = ["Claudio Dall'Ara"]
description = "Ultra-fast retrogaming launcher and catalog manager in Rust"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.32", features = ["bundled"] }
strsim = "0.11" # Fuzzy string matching (Levenshtein, Jaro-Winkler)
regex = "1.10"
walkdir = "2.5"
open = "5.3"     # Open files and URLs natively on Windows

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
