<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="400" height="600">
  <defs>
    <linearGradient id="bg_ld" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18071e"/>
      <stop offset="50%" stop-color="#2a0d35"/>
      <stop offset="100%" stop-color="#0d0411"/>
    </linearGradient>
    <linearGradient id="neon_ld" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <radialGradient id="glow_ld" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="400" height="600" rx="16" fill="url(#bg_ld)"/>
  <circle cx="200" cy="240" r="160" fill="url(#glow_ld)"/>
  
  <rect x="12" y="12" width="376" height="576" rx="12" fill="none" stroke="url(#neon_ld)" stroke-width="2.5" stroke-opacity="0.6"/>
  <rect x="18" y="18" width="364" height="574" rx="8" fill="none" stroke="#ec4899" stroke-width="0.75" stroke-opacity="0.2"/>

  <!-- Top Badge -->
  <rect x="80" y="32" width="240" height="28" rx="14" fill="#ec4899" fill-opacity="0.15" stroke="#ec4899" stroke-width="1.5"/>
  <text x="200" y="51" fill="#f43f5e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="900" letter-spacing="3" text-anchor="middle">📀 LASERDISC ARCADE 📀</text>

  <!-- Center Laserdisc Disc Graphic -->
  <g transform="translate(200, 240)">
    <circle cx="0" cy="0" r="100" fill="#1e1028" stroke="#ec4899" stroke-width="4"/>
    <!-- Rainbow sheen lines -->
    <circle cx="0" cy="0" r="80" fill="none" stroke="#a855f7" stroke-width="2" stroke-opacity="0.5"/>
    <circle cx="0" cy="0" r="60" fill="none" stroke="#06b6d4" stroke-width="2" stroke-opacity="0.5"/>
    <circle cx="0" cy="0" r="40" fill="none" stroke="#f43f5e" stroke-width="2" stroke-opacity="0.5"/>
    <!-- Center spindle hole -->
    <circle cx="0" cy="0" r="22" fill="#0d0411" stroke="#ec4899" stroke-width="3"/>
    <!-- Optical Pickup Lens -->
    <circle cx="45" cy="45" r="10" fill="#00f2fe" fill-opacity="0.8"/>
  </g>

  <!-- Title & Meta -->
  <text x="200" y="440" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="900" text-anchor="middle" letter-spacing="0.5">
    Thayer&#x27;s Quest
  </text>
  <text x="200" y="470" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800" text-anchor="middle" fill-opacity="0.9">
    
  </text>

  <rect x="60" y="515" width="280" height="36" rx="18" fill="#000" fill-opacity="0.5" stroke="#471b4d" stroke-width="1"/>
  <text x="200" y="538" fill="#e879f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1">
    HYPSEUS SINGE • 1984
  </text>
</svg>