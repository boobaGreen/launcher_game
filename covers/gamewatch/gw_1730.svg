<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="400" height="600">
  <defs>
    <linearGradient id="bg_gw" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917"/>
      <stop offset="50%" stop-color="#292524"/>
      <stop offset="100%" stop-color="#0c0a09"/>
    </linearGradient>
    <linearGradient id="gold_border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="lcd_screen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a3b18a"/>
      <stop offset="100%" stop-color="#8a9a6e"/>
    </linearGradient>
  </defs>

  <!-- Handheld Outer Chassis -->
  <rect width="400" height="600" rx="20" fill="url(#bg_gw)"/>
  <rect x="12" y="12" width="376" height="576" rx="16" fill="none" stroke="url(#gold_border)" stroke-width="3" stroke-opacity="0.8"/>
  <rect x="20" y="20" width="360" height="560" rx="12" fill="none" stroke="#78716c" stroke-width="1" stroke-opacity="0.4"/>

  <!-- Top Badge -->
  <rect x="70" y="32" width="260" height="26" rx="13" fill="#b45309" fill-opacity="0.2" stroke="#d97706" stroke-width="1.5"/>
  <text x="200" y="50" fill="#f59e0b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="900" letter-spacing="3" text-anchor="middle">★ GAME &amp; WATCH ★</text>

  <!-- Handheld Faceplate & LCD Screen -->
  <g transform="translate(200, 230)">
    <!-- Gold Metallic Faceplate -->
    <rect x="-140" y="-120" width="280" height="200" rx="12" fill="#d97706" fill-opacity="0.25" stroke="#b45309" stroke-width="2"/>
    <!-- Liquid Crystal Display -->
    <rect x="-110" y="-95" width="220" height="150" rx="6" fill="url(#lcd_screen)" stroke="#44403c" stroke-width="3"/>
    
    <!-- LCD Segment Character Silhouettes -->
    <text x="0" y="-20" fill="#283618" font-family="Courier, monospace" font-size="42" font-weight="900" text-anchor="middle">🕹️</text>
    <text x="0" y="25" fill="#1b2310" font-family="Courier, monospace" font-size="16" font-weight="900" text-anchor="middle" letter-spacing="2">TIME 12:00</text>
    <text x="-70" y="-60" fill="#1b2310" font-family="Courier, monospace" font-size="14" font-weight="900">GAME A</text>
    <text x="30" y="-60" fill="#1b2310" font-family="Courier, monospace" font-size="14" font-weight="900">GAME B</text>

    <!-- Controls (Cross D-Pad and Buttons) -->
    <circle cx="-90" cy="115" r="14" fill="#dc2626" stroke="#991b1b" stroke-width="2"/>
    <circle cx="90" cy="115" r="14" fill="#dc2626" stroke="#991b1b" stroke-width="2"/>
  </g>

  <!-- Title & Meta -->
  <text x="200" y="440" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="900" text-anchor="middle" letter-spacing="0.5">
    Popeye
  </text>
  <text x="200" y="470" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800" text-anchor="middle" fill-opacity="0.9">
    
  </text>

  <rect x="60" y="515" width="280" height="36" rx="18" fill="#000" fill-opacity="0.5" stroke="#44403c" stroke-width="1"/>
  <text x="200" y="538" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1">
    NINTENDO LCD • 1981
  </text>
</svg>